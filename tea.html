<!DOCTYPE html>
<html>
<head>
    <title>Tea</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
        }

        #tea-container {
            position: relative;
            width: 700px;
        }

        /* 빈 컵 + 아이메시지 전체 이미지 */
        #background {
            width: 100%;
            display: block;
        }

        /* 녹차 */
        #tea {
            position: absolute;
            top: 0;
            left: 0;

            /* 배경 이미지와 완전히 같은 크기로 겹치기 */
            width: 100%;
            height: 100%;

            pointer-events: none;

            /* 1초 동안 천천히 투명해졌다가 나타남 */
            transition: opacity 1s ease;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 18px;
            font-size: 16px;
            background: white;
            border: 1px solid #999;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="tea-container">

        <!-- 빈 컵 + 아이메시지 전체 -->
        <img
            id="background"
            src="tea-background.png"
        >

        <!-- 녹차 -->
        <img
            id="tea"
            src="tea.png"
        >

    </div>

    <div class="buttons">
        <button onclick="drinkTea()">마시기</button>
        <button onclick="pourTea()">따르기</button>
    </div>


    <script>

        const tea = document.getElementById("tea");

        function drinkTea() {
            // 1초 동안 녹차가 서서히 사라짐
            tea.style.opacity = "0";
        }

        function pourTea() {
            // 1초 동안 녹차가 서서히 나타남
            tea.style.opacity = "1";
        }

    </script>

</body>
</html>
